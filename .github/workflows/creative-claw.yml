name: Creative Claw

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creative-claw-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  demo-checks:
    name: Creative Claw demo checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENCLAW_VITEST_MAX_WORKERS: "1"
      OPENCLAW_TSDOWN_MAX_OLD_SPACE_MB: "4096"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Setup repository runtime and dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"
      - name: Install video test tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Test video, cancellation, persistence, and GPU coordination
        run: >-
          node scripts/run-vitest.mjs run
          --config test/vitest/vitest.extensions.config.ts
          extensions/creative-engines/src/ffi/video-stream.test.ts
          extensions/creative-engines/src/studio-cancellation.test.ts
          extensions/creative-engines/src/studio-jobs.test.ts
          extensions/gpu-broker/src/broker.test.ts
      - name: Build application and Control UI
        run: pnpm build
      - name: Check CLI bootstrap
        run: node openclaw.mjs --version
